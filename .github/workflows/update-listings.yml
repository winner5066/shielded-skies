name: Update listings snapshot

# Timer for Shielded Skies: keep the embedded listings snapshot fresh.
# This does NOT make the game truly live per page open (the API has no
# CORS header, so the browser still falls back to this snapshot). It
# keeps that snapshot from going stale: every 6 hours it fetches the
# live listings and, only if they changed, commits a new index.html.
# GitHub Pages then redeploys from main automatically.
on:
  schedule:
    # Every 6 hours, UTC. GitHub may delay scheduled runs by a few minutes.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update snapshot from live API
        run: python3 scripts/update_listings.py index.html
      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No listings change, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: update listings snapshot from live API"
          git push
